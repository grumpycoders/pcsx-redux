name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            project: dev-linux-x64
            secret: APPDISTRIB_DEV_LINUX_X64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            project: dev-linux-arm64
            secret: APPDISTRIB_DEV_LINUX_ARM64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
      env:
        TEST_RESULTS: /tmp/test-results
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - run: |
          make -j 2 all pcsx-redux-tests tools
          make -C src/mips/tests -j 2 PCSX_TESTS=true
          # The tests above leave third_party/uC-sdk objects built with their own
          # flags, and openbios links a different subset of that same libc. Without
          # this clean it fails on undefined malloc/free/write. Keep it.
          make -C src/mips/openbios -j 2 clean all
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '22.6.0'
      - name: Install jq
        run: |
          apt update
          apt install -y jq
      - name: Packaging
        env:
          APPDISTRIB_TOKEN: ${{ secrets[matrix.secret] }}
          APPDISTRIB_ORGANIZATION: pcsx-redux
          APPDISTRIB_PROJECT: ${{ matrix.project }}
        run: |
          npx @appdistrib/cli buildid > buildid.json
          git config --global --add safe.directory /__w/pcsx-redux/pcsx-redux
          make install install-openbios DESTDIR=AppDir/usr
          sed -i s:/usr/bin/:: AppDir/usr/share/applications/pcsx-redux.desktop
          echo '{' > version.json
          echo '  "version": "'`git rev-parse HEAD | cut -c 1-8`'",' >> version.json
          echo '  "buildId": '`jq -r .buildid buildid.json`',' >> version.json
          echo '  "changeset": "'`git rev-parse HEAD`'",' >> version.json
          echo '  "timestamp": '`date '+%s'`',' >> version.json
          echo '  "channel": "dev",' >> version.json
          echo '  "updateInfo": [' >> version.json
          echo '    {' >> version.json
          echo '      "channel": "dev",' >> version.json
          echo '      "method": "appdistrib",' >> version.json
          echo '      "updateCatalog": "https://distrib.app/storage/manifests/pcsx-redux/${{ matrix.project }}/manifest.json",' >> version.json
          echo '      "updateInfoBase": "https://distrib.app/storage/manifests/pcsx-redux/${{ matrix.project }}/",' >> version.json
          echo '      "updateStorageUrl": "https://distrib.app/"' >> version.json
          echo '    }' >> version.json
          echo '  ]' >> version.json
          echo '}' >> version.json
          cp version.json AppDir/usr/share/pcsx-redux/resources
          linuxdeploy -v 3 --appdir=AppDir -e AppDir/usr/bin/pcsx-redux -d AppDir/usr/share/applications/pcsx-redux.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/pcsx-redux.png -o appimage
          mv PCSX-Redux-${{ matrix.arch }}.AppImage PCSX-Redux-HEAD-${{ matrix.arch }}.AppImage
      - name: Test
        run: |
          export GTEST_OUTPUT=xml:${TEST_RESULTS}/
          mkdir -p $TEST_RESULTS
          xvfb-run catchsegv ./pcsx-redux-tests
      - name: Deploy
        if: github.event_name == 'push'
        env:
          APPDISTRIB_TOKEN: ${{ secrets[matrix.secret] }}
          APPDISTRIB_ORGANIZATION: pcsx-redux
          APPDISTRIB_PROJECT: ${{ matrix.project }}
        run: |
          git config --global --add safe.directory /__w/pcsx-redux/pcsx-redux
          export BUILD=`git rev-parse HEAD | cut -c 1-8`
          zip PCSX-Redux-$BUILD-linux-${{ matrix.arch }}.zip *.AppImage
          npx @appdistrib/cli -l buildId -m version.json upload PCSX-Redux-$BUILD-linux-${{ matrix.arch }}.zip
